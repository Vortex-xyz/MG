<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  @font-face {
    font-family: "Card Display";
    src: url("file:///workspace/.grok/fonts/CormorantGaramond-500.ttf") format("truetype");
    font-weight: 500;
    font-style: normal;
  }
  @font-face {
    font-family: "Card Text";
    src: url("file:///workspace/.grok/fonts/LibreBaskerville-var.ttf") format("truetype");
    font-weight: 400;
    font-style: normal;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background: #100e0c;
  }
  .stage {
    width: 1200px;
    height: 630px;
    background:
      radial-gradient(ellipse at 50% 46%, #1a1613 0%, #100e0c 68%);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .sheet {
    width: 820px;
    height: 448px;
    background: #f3efe8;
    position: relative;
    box-shadow:
      0 1px 0 rgba(243, 239, 232, 0.18),
      0 28px 70px rgba(0, 0, 0, 0.45);
  }
  .grain {
    position: absolute;
    inset: 0;
    pointer-events: none;
    opacity: 0.22;
    mix-blend-mode: multiply;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }
  .plate {
    position: absolute;
    inset: 22px;
    border: 1px solid #a39c93;
  }
  .plate-inner {
    position: absolute;
    inset: 6px;
    border: 1px solid rgba(163, 156, 147, 0.55);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .mark {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #8f3d34;
    margin-bottom: 26px;
  }
  h1 {
    font-family: "Card Display", "Liberation Serif", serif;
    font-weight: 500;
    font-size: 112px;
    line-height: 0.82;
    letter-spacing: 0.01em;
    color: #100e0c;
  }
  .rule {
    width: 56px;
    height: 1px;
    background: #a39c93;
    margin: 26px 0 18px;
  }
  .tag {
    font-family: "Card Text", "Liberation Serif", serif;
    font-weight: 400;
    font-size: 15px;
    letter-spacing: 0.34em;
    text-transform: uppercase;
    color: #100e0c;
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="sheet">
      <div class="grain"></div>
      <div class="plate">
        <div class="plate-inner">
          <div class="mark" aria-hidden="true"></div>
          <h1>Kumkum</h1>
          <div class="rule"></div>
          <p class="tag">A quiet register</p>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
